          <td>01</td>

        </tr>
        <tr>
          <td>02</td>
          <td>Aman</td>

          <td>Web dev.</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>total students: 02</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
