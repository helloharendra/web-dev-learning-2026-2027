<html>
<head>
    <title>List Examples</title>
</head>
<body>
<h6>Ordered list example</h6>
<ol>
    <li>Mango</li>
    <li>Banana</li>
</ol>
<h6>Unordered list example</h6>
<ul>
    <li>Apple</li>
    <li>Grapes</li>
</ul>
<dl>
    <dt>
        Mango
    </dt>
    <dd>
        A tropical fruit with a sweet, juicy flesh.
    </dd>
    <dt>
        Banana
    </dt>
    <dd>
        A long, curved fruit with a soft, creamy flesh.
    </dd>
</dl>
</html>
