<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <h1 class="animated-title">Advanced CSS Animations</h1>
    
    <div class="animation-demo">
        <h2>Hover Animations</h2>
        <div class="card-container">
            <div class="hover-card scale">Scale</div>
            <div class="hover-card rotate">Rotate</div>
            <div class="hover-card skew">Skew</div>
            <div class="hover-card translate">Translate</div>
        </div>
    </div>
    
    <div class="animation-demo">
        <h2>Keyframe Animations</h2>
        <div class="loader-container">
            <div class="loader"></div>
            <div class="pulse-demo"></div>
            <div class="bounce-demo"></div>
        </div>
    </div>
    
    <div class="animation-demo">
        <h2>3D Transformations</h2>
        <div class="cube-container">
            <div class="cube">
                <div class="face front">Naya Prayog</div>
                <div class="face back">Academy</div>
                <div class="face right">Atrauliya</div>
                <div class="face left">Azamgarh</div>
                <div class="face top">Coding</div>
                <div class="face bottom">Courses</div>
            </div>
        </div>
    </div>
    
    <div class="animation-demo">
        <h2>Scroll Animations</h2>
        <div class="scroll-container">
            <div class="scroll-item">Item 1</div>
            <div class="scroll-item">Item 2</div>
            <div class="scroll-item">Item 3</div>
            <div class="scroll-item">Item 4</div>
            <div class="scroll-item">Item 5</div>
        </div>
    </div>
</body>
</html>
